# =============================================================================
# Global Prefix Settings
# =============================================================================
set -g prefix C-a
unbind C-b

# Send Ctrl-a to programs inside tmux by pressing Ctrl-a twice
bind C-a send-prefix

# =============================================================================
# General Options
# =============================================================================
set-option -g focus-events on
set-option -s escape-time 0
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse mode
set -g mouse on
bind m set -g mouse \; display "Mouse is #{?#{mouse},on,off}"

# Use vi keys in copy mode and command line
setw -g mode-keys vi
set -g status-keys vi

# =============================================================================
# Key Bindings
# =============================================================================
# Reload configuration
bind r source-file ~/.tmux.conf \; display "✅ Reloaded ~/.tmux.conf"

# Window/Pane Splitting
bind | split-window -h
bind '\' split-window -h
bind - split-window -v

# Pane Navigation (h,j,k,l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window Navigation (Ctrl-h, Ctrl-l)
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Window Reordering
bind-key -r C-Left swap-window -t -1\; select-window -t -1
bind-key -r C-Right swap-window -t +1\; select-window -t +1

# Pane Resizing (H,J,K,L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# smart-splits.nvim — seamless nav (C-h/j/k/l) + resize (M-h/j/k/l), Neovim <-> tmux
# Prefixless (root table); coexists with the prefixed pane binds above. @pane-is-vim is
# set by smart-splits.nvim on load, so do not lazy-load that plugin.
# =============================================================================
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Copy Mode Bindings
#  [ to switch to copy mode
#  v to start visual mode
#  V to start visual mode (Visual Line)
#  Ctrl-v to toggle visual block
#  y to yank selected text into copy buffer
#  p to paste text from buffer
#  Escape to exit copy mode
#  use vi movements when working inside the tmux buffer
#  See <prefix>-:list-keys -t copy-mode-vi
unbind [
bind [ copy-mode
unbind p
bind p paste-buffer

bind-key -T edit-mode-vi Up send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down
unbind-key -T copy-mode-vi Space  ; bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi C-v    ; bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi y      ; bind-key -T copy-mode-vi y send-keys -X copy-selection
unbind-key -T copy-mode-vi Escape ; bind-key -T copy-mode-vi Escape send-keys -X cancel

# Toggle to last window
bind-key C-x last-window

# =============================================================================
# Git-worktree sessionizer — fuzzy-jump to (or create) a tmux session per worktree.
# prefix C-o (overrides the default rotate-window, unused here). "o" = open worktree.
# Script: ~/bin/tmux-worktree-sessionizer (git worktree list -> fzf -> switch/create).
# `-d '#{pane_current_path}'` opens the popup in the active pane's dir so the script sees
# the repo you're standing in; $HOME expands in the popup's shell; the popup inherits the
# tmux server's login-shell PATH (bash.3.d/reorderPath.sh is the source of truth) — no PATH
# is hardcoded, so if a tool is ever missing, fix how the tmux server starts.
# =============================================================================
unbind C-o
bind-key C-o display-popup -E -d '#{pane_current_path}' -w 80% -h 70% '$HOME/bin/tmux-worktree-sessionizer'

# =============================================================================
# UI & Status Bar
# =============================================================================
set -g status-justify centre
set -g status-interval 60
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-right "#[fg=cyan]%d %b %R"

setw -g monitor-activity on
set -g visual-activity on

# =============================================================================
# External Configuration & Final Linkage
# =============================================================================
# Source platform and theme settings
source-file ~/.tmux.platform.conf
source-file ~/.tmux.solarizeddark.conf

# =============================================================================
# TPM — tmux plugin manager (github.com/tmux-plugins/tpm)
# Vendored as a submodule at tmux/plugins/tpm, symlinked to ~/.tmux/plugins/tpm by rcm.
# Manage: prefix+I install · prefix+U update · prefix+alt+u clean
#         headless: ~/.tmux/plugins/tpm/bin/install_plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'

# --- AI-agent monitor: try ONE at a time (comment/uncomment to switch, then prefix+I) ---
set -g @plugin 'hiroppy/tmux-agent-sidebar'      # rich sidebar; prefix+e (window) / prefix+E (all); Claude/Codex/OpenCode
# set -g @plugin 'samleeney/tmux-agent-status'   # session status + fzf switcher; prefix+o sidebar, prefix+S switcher; Claude/Codex/Devin
# set -g @agent-park-key 'P'                      # (tmux-agent-status only) move park off prefix+p so paste keeps it

# --- session persistence ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# --- skipped: tmux-yank is copy-only, uses LOCAL tools (xsel/pbcopy/clip.exe), no OSC52, and
#     won't copy over SSH — your set-clipboard on + Ghostty OSC52 already covers all OSes + SSH.
#     Uncomment only if you want its prefix+y command-line/pwd copy extras.
# set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM. Kept here (before FINAL OVERRIDES) so your default-terminal/set-clipboard win.
run '~/.tmux/plugins/tpm/tpm'

# FINAL OVERRIDES: Ghostty & Modern Terminal Integration
# These must remain at the end to ensure they take precedence
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:clipboard"
set -as terminal-overrides ",*:Tc"
set -s set-clipboard on

# Remote Session Logic: Hide status bar if connected via SSH
if-shell '[[ -n "$SSH_CLIENT" ]]' 'set -g status off'

# F12 Mode Toggle: Engage/Disengage local control for remote proxy sessions
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=color245,bg=color235" \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S
